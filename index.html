<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>福岡グルメナビ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @media print {
            body {
                background-color: white !important;
                color: #1f2937 !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            .no-print {
                display: none !important;
            }
            .print-only {
                display: block !important;
            }
            @page {
                size: A4 portrait;
                margin: 10mm;
            }
            .print-card {
                break-inside: avoid;
                page-break-inside: avoid;
                border: 1px solid #e5e7eb !important;
                box-shadow: none !important;
            }
        }
        .print-only {
            display: none;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased min-h-screen flex flex-col">

    <!-- メインヘッダー -->
    <header class="bg-white shadow-sm sticky top-0 z-30 no-print">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-2 cursor-pointer" onclick="resetFilters()">
                <div class="bg-red-500 text-white p-2 rounded-xl font-bold text-xl flex items-center justify-center w-10 h-10 shadow-md">福</div>
                <div>
                    <h1 class="text-xl font-bold text-gray-900 tracking-tight">福岡グルメナビ</h1>
                    <p class="text-xs text-gray-500">スプレッドシート連動版</p>
                </div>
            </div>
            <div class="relative w-full sm:w-80">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400"><i class="fa-solid fa-magnifying-glass"></i></span>
                <input type="text" id="searchInput" placeholder="店名、ジャンル、エリア、住所で検索..." oninput="filterRestaurants()" class="w-full pl-10 pr-4 py-2 border border-gray-200 rounded-full text-sm focus:outline-none focus:ring-2 focus:ring-red-500 bg-gray-50">
            </div>
            <div class="flex items-center gap-2 w-full sm:w-auto justify-end flex-wrap">
                <button onclick="openConfigModal()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 text-sm font-medium px-3.5 py-2 rounded-full shadow-sm transition flex items-center gap-1.5 whitespace-nowrap"><i class="fa-solid fa-gear"></i> 設定</button>
                <button onclick="fetchSheetData()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-medium px-3.5 py-2 rounded-full shadow-sm transition flex items-center gap-1.5 whitespace-nowrap"><i class="fa-solid fa-rotate"></i> データ更新</button>
                <button onclick="triggerPrint()" class="bg-gray-800 hover:bg-gray-900 text-white text-sm font-medium px-4 py-2 rounded-full shadow-sm transition flex items-center gap-1.5 whitespace-nowrap"><i class="fa-solid fa-file-pdf"></i> PDF/印刷</button>
            </div>
        </div>
    </header>

    <!-- メインコンテンツ -->
    <main class="max-w-7xl mx-auto px-4 py-6 flex-grow w-full no-print">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6">
            <div class="flex bg-gray-200 p-1 rounded-xl">
                <button id="tabAll" onclick="switchTab('all')" class="px-5 py-2 rounded-lg text-sm font-semibold transition bg-white text-gray-900 shadow-sm">すべての店舗 (<span id="countAll">0</span>)</button>
                <button id="tabVisited" onclick="switchTab('visited')" class="px-5 py-2 rounded-lg text-sm font-semibold transition text-gray-600 hover:text-gray-900">行ったお店 (<span id="countVisited">0</span>)</button>
            </div>
            <div id="genreFilters" class="flex flex-wrap gap-1.5 items-center"></div>
        </div>

        <!-- ローディング表示 -->
        <div id="loadingIndicator" class="text-center py-16">
            <div id="loadingSpinner" class="text-red-500 text-4xl mb-3 animate-spin"><i class="fa-solid fa-circle-notch"></i></div>
            <p id="loadingText" class="text-gray-600 font-medium">スプレッドシートからデータを読み込んでいます...</p>
            <div id="errorDetail" class="mt-4 text-xs text-red-600 max-w-md mx-auto hidden bg-red-50 p-3 rounded-xl border border-red-200"></div>
        </div>

        <div id="restaurantGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>

        <div id="noResults" class="hidden text-center py-16">
            <div class="text-gray-400 text-5xl mb-3"><i class="fa-solid fa-utensils"></i></div>
            <p class="text-gray-600 font-medium">条件に一致するお店が見つかりませんでした。</p>
            <button onclick="resetFilters()" class="mt-4 text-red-500 text-sm font-semibold hover:underline">検索条件をリセットする</button>
        </div>
    </main>

    <!-- 印刷・PDF専用エリア -->
    <div id="print-container" class="print-only p-2 w-full">
        <div class="mb-6 pb-4 border-b-2 border-gray-800 flex justify-between items-end">
            <div>
                <span class="text-xs uppercase tracking-widest text-red-600 font-bold">Fukuoka Gourmet Collection</span>
                <h2 style="font-size: 24px; font-weight: 800; margin-top: 2px;">福岡グルメガイド & 訪問ログ</h2>
            </div>
            <div class="text-right text-xs text-gray-500">
                <span>出力日: <span id="printDate"></span></span>
            </div>
        </div>
        <div id="printGrid" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px;"></div>
    </div>

    <footer class="bg-white border-t border-gray-200 mt-auto py-4 text-center text-xs text-gray-500 no-print">&copy; 2026 福岡グルメナビ</footer>

    <!-- スプレッドシート連携設定モーダル -->
    <div id="configModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden no-print">
        <div class="bg-white rounded-2xl max-w-lg w-full overflow-hidden shadow-2xl p-6 space-y-4">
            <div class="flex justify-between items-center">
                <h3 class="text-lg font-bold text-gray-900 flex items-center gap-2"><i class="fa-solid fa-file-excel text-emerald-600"></i>スプレッドシート連携設定（GAS連携）</h3>
                <button onclick="closeConfigModal()" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1">GAS ウェブアプリ URL</label>
                <input type="text" id="sheetUrlInput" placeholder="https://script.google.com/macros/s/.../exec" class="w-full text-xs p-3 border border-gray-200 rounded-xl bg-gray-50 focus:outline-none focus:ring-2 focus:ring-emerald-500">
            </div>
            <div class="pt-2 flex justify-end gap-2">
                <button type="button" onclick="closeConfigModal()" class="px-4 py-2 bg-gray-100 text-gray-700 text-sm font-semibold rounded-xl">キャンセル</button>
                <button type="button" onclick="saveConfigAndReload()" class="px-5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold rounded-xl shadow-md transition">保存して読み込む</button>
            </div>
        </div>
    </div>

    <!-- 詳細モーダル -->
    <div id="detailModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden no-print">
        <div class="bg-white rounded-2xl max-w-lg w-full overflow-hidden shadow-2xl max-h-[90vh] flex flex-col">
            <div class="relative h-48 bg-gray-100 flex-shrink-0">
                <img id="modalImg" src="" alt="店舗画像" class="w-full h-full object-cover">
                <button onclick="closeDetailModal()" class="absolute top-3 right-3 bg-black/60 hover:bg-black/80 text-white w-8 h-8 rounded-full flex items-center justify-center transition"><i class="fa-solid fa-xmark"></i></button>
                <div id="modalVisitedBadge" class="absolute bottom-3 left-3 bg-emerald-600 text-white text-xs px-3 py-1 rounded-full font-bold shadow-md hidden flex items-center gap-1"><i class="fa-solid fa-check"></i> 行ったお店</div>
            </div>
            <div class="p-6 overflow-y-auto space-y-4">
                <div class="flex justify-between items-start">
                    <div>
                        <span id="modalGenre" class="text-xs font-semibold px-2.5 py-1 rounded-full bg-red-50 text-red-600 inline-block mb-2"></span>
                        <h2 id="modalName" class="text-2xl font-bold text-gray-900"></h2>
                        <p id="modalArea" class="text-sm text-gray-500 mt-0.5"><i class="fa-solid fa-location-dot mr-1 text-red-500"></i></p>
                    </div>
                    <div class="text-right">
                        <div class="text-amber-500 font-bold text-lg"><i class="fa-solid fa-star mr-1"></i><span id="modalRating"></span></div>
                        <p id="modalBudget" class="text-xs text-gray-500"></p>
                    </div>
                </div>

                <div class="border-t border-gray-100 pt-3 space-y-2">
                    <p class="text-sm text-gray-700 leading-relaxed" id="modalDesc"></p>
                    <div id="modalAddressContainer" class="text-xs text-gray-600 flex items-center gap-2"><i class="fa-solid fa-map-pin text-red-500"></i> <span id="modalAddress"></span></div>
                    <div id="modalUrlContainer" class="text-xs text-blue-600 truncate"><i class="fa-solid fa-link mr-1"></i> <a id="modalUrl" href="#" target="_blank" class="hover:underline">公式サイトを見る</a></div>
                </div>

                <!-- 訪問ログ -->
                <div class="bg-gray-50 p-4 rounded-xl border border-gray-200 space-y-3">
                    <div class="flex items-center justify-between">
                        <span class="text-sm font-bold text-gray-800">マイ訪問ログ（この端末に保存）</span>
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" id="modalVisitedToggle" onchange="toggleVisitedStatus()" class="sr-only peer">
                            <div class="w-11 h-6 bg-gray-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-emerald-600"></div>
                            <span class="ml-2 text-xs font-medium text-gray-700">行った！</span>
                        </label>
                    </div>
                    <div class="space-y-2 pt-2 border-t border-gray-200">
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-[11px] font-bold text-gray-500 mb-1">訪問時期</label>
                                <input type="text" id="modalVisitDate" placeholder="例: 2026年秋" oninput="saveVisitData()" class="w-full text-xs p-2 border border-gray-200 rounded-lg bg-white">
                            </div>
                            <div>
                                <label class="block text-[11px] font-bold text-gray-500 mb-1">自分の評価</label>
                                <select id="modalMyRating" onchange="saveVisitData()" class="w-full text-xs p-2 border border-gray-200 rounded-lg bg-white">
                                    <option value="5">⭐⭐⭐⭐⭐ 最高</option>
                                    <option value="4">⭐⭐⭐⭐ 満足</option>
                                    <option value="3">⭐⭐⭐ 普通</option>
                                    <option value="2">⭐⭐ もう一歩</option>
                                    <option value="1">⭐ イマイチ</option>
                                </select>
                            </div>
                        </div>
                        <div>
                            <label class="block text-[11px] font-bold text-gray-500 mb-1">メモ・感想</label>
                            <textarea id="modalMyMemo" rows="2" placeholder="感想など" oninput="saveVisitData()" class="w-full text-xs p-2 border border-gray-200 rounded-lg bg-white"></textarea>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const DEFAULT_SHEET_URL = 'https://script.google.com/macros/s/AKfycbz9f1xXJa893q17aAVyfBSr78n5yEN3W7ZGUQWSlmw0TCmwFAEMH9A898q0ZsLgLrKd6Q/exec';

        let restaurants = [];
        let visitedData = {};
        let currentTab = 'all';
        let selectedGenre = 'すべて';
        let currentModalId = null;
        let sheetUrl = '';

        function initApp() {
            sheetUrl = localStorage.getItem('fukuoka_sheet_url') || DEFAULT_SHEET_URL;
            visitedData = JSON.parse(localStorage.getItem('fukuoka_visited_data') || '{}');
            
            if (!sheetUrl) {
                document.getElementById('loadingIndicator').classList.add('hidden');
                openConfigModal();
                return;
            }
            fetchSheetData();
        }

        async function fetchSheetData() {
            if (!sheetUrl) {
                openConfigModal();
                return;
            }

            const loadingIndicator = document.getElementById('loadingIndicator');
            const loadingSpinner = document.getElementById('loadingSpinner');
            const loadingText = document.getElementById('loadingText');
            const errorDetail = document.getElementById('errorDetail');

            loadingIndicator.classList.remove('hidden');
            loadingSpinner.classList.remove('hidden');
            loadingText.innerText = 'スプレッドシートからデータを読み込んでいます...';
            errorDetail.classList.add('hidden');
            errorDetail.innerText = '';
            document.getElementById('restaurantGrid').innerHTML = '';

            try {
                const separator = sheetUrl.includes('?') ? '&' : '?';
                const targetUrl = sheetUrl + separator + 't=' + new Date().getTime();
                
                const response = await fetch(targetUrl);
                if (!response.ok) throw new Error(`HTTPエラー! ステータス: ${response.status}`);
                
                const text = await response.text();
                let rows;
                try {
                    rows = JSON.parse(text);
                } catch (e) {
                    throw new Error('取得したデータが正しいJSON形式ではありません。');
                }

                if (!Array.isArray(rows)) {
                    throw new Error('スプレッドシートのデータ構造が正しくありません。');
                }

                restaurants = parseSheetRows(rows);
                
                loadingIndicator.classList.add('hidden');
                renderGenreFilters();
                renderRestaurants();
                updateCounts();
            } catch (error) {
                console.error(error);
                loadingSpinner.classList.add('hidden');
                loadingText.innerText = 'データの読み込みに失敗しました。';
                errorDetail.innerText = error.message;
                errorDetail.classList.remove('hidden');
            }
        }

        function parseSheetRows(rows) {
            const result = [];
            for (let i = 1; i < rows.length; i++) {
                const cols = rows[i];
                if (!cols || !cols[0]) continue;

                result.push({
                    id: i, // 1行目がヘッダー、2行目以降が店舗データ
                    name: String(cols[0] || ''),
                    genre: String(cols[1] || '未分類'),
                    area: String(cols[2] || '福岡市内'),
                    budget: String(cols[3] || ''),
                    rating: parseFloat(cols[4]) || 4.0,
                    url: String(cols[5] || ''),
                    desc: String(cols[6] || ''),
                    image: String(cols[7] || 'https://images.unsplash.com/photo-1555396273-367ea4eb4db5?auto=format&fit=crop&w=600&q=80'),
                    address: String(cols[8] || '福岡市内')
                });
            }
            return result;
        }

        function saveVisitDataLocally() {
            localStorage.setItem('fukuoka_visited_data', JSON.stringify(visitedData));
            updateCounts();
        }

        function updateCounts() {
            document.getElementById('countAll').innerText = restaurants.length;
            
            // 実際に読み込まれている店舗のID（id）リストを作成
            const validIds = new Set(restaurants.map(r => r.id));
            
            // 読み込まれている店舗の中で、かつ「visited: true」のものだけを正確にカウント
            const visitedCount = Object.keys(visitedData).filter(id => {
                return validIds.has(Number(id)) && visitedData[id] && visitedData[id].visited;
            }).length;

            document.getElementById('countVisited').innerText = visitedCount;
        }

        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('tabAll').className = tab === 'all' ? "px-5 py-2 rounded-lg text-sm font-semibold transition bg-white text-gray-900 shadow-sm" : "px-5 py-2 rounded-lg text-sm font-semibold transition text-gray-600 hover:text-gray-900";
            document.getElementById('tabVisited').className = tab === 'visited' ? "px-5 py-2 rounded-lg text-sm font-semibold transition bg-white text-gray-900 shadow-sm" : "px-5 py-2 rounded-lg text-sm font-semibold transition text-gray-600 hover:text-gray-900";
            renderRestaurants();
        }

        function renderGenreFilters() {
            const genres = ['すべて', ...new Set(restaurants.map(r => r.genre))];
            document.getElementById('genreFilters').innerHTML = genres.map(g => `
                <button onclick="setGenre('${g}')" class="px-3 py-1 rounded-full text-xs font-medium transition ${selectedGenre === g ? 'bg-red-500 text-white shadow-sm' : 'bg-white text-gray-600 border border-gray-200'}">${g}</button>
            `).join('');
        }

        function setGenre(g) { selectedGenre = g; renderGenreFilters(); renderRestaurants(); }
        function resetFilters() { document.getElementById('searchInput').value = ''; selectedGenre = 'すべて'; renderGenreFilters(); renderRestaurants(); }

        function renderRestaurants() {
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            const grid = document.getElementById('restaurantGrid');
            const printGrid = document.getElementById('printGrid');
            const noResults = document.getElementById('noResults');

            const filtered = restaurants.filter(r => {
                const isVisited = visitedData[r.id]?.visited;
                if (currentTab === 'visited' && !isVisited) return false;
                if (selectedGenre !== 'すべて' && r.genre !== selectedGenre) return false;
                if (keyword && !r.name.toLowerCase().includes(keyword) && !r.genre.toLowerCase().includes(keyword) && !r.area.toLowerCase().includes(keyword) && !(r.address && r.address.toLowerCase().includes(keyword))) return false;
                return true;
            });

            if (filtered.length === 0) {
                grid.innerHTML = '';
                noResults.classList.remove('hidden');
            } else {
                noResults.classList.add('hidden');
                grid.innerHTML = filtered.map(r => {
                    const isVisited = visitedData[r.id]?.visited;
                    const vInfo = visitedData[r.id] || {};
                    return `
                        <div onclick="openDetailModal(${r.id})" class="bg-white rounded-2xl overflow-hidden shadow-sm hover:shadow-md transition border border-gray-100 cursor-pointer flex flex-col group">
                            <div class="relative h-48 bg-gray-100 overflow-hidden">
                                <img src="${r.image}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
                                ${isVisited ? '<span class="absolute top-3 left-3 bg-emerald-600 text-white text-xs px-2.5 py-1 rounded-full font-bold shadow-md"><i class="fa-solid fa-check"></i> 行った店</span>' : ''}
                                <span class="absolute bottom-3 left-3 bg-black/60 text-white text-xs px-2.5 py-1 rounded-full">${r.genre}</span>
                            </div>
                            <div class="p-5 flex flex-col flex-grow">
                                <div class="flex justify-between items-start mb-1">
                                    <h3 class="font-bold text-lg text-gray-900 group-hover:text-red-500">${r.name}</h3>
                                    <span class="text-amber-500 font-bold text-sm"><i class="fa-solid fa-star"></i>${r.rating}</span>
                                </div>
                                <p class="text-xs text-gray-500 mb-1"><i class="fa-solid fa-location-dot text-red-500 mr-1"></i>${r.area}</p>
                                ${r.address ? `<p class="text-[11px] text-gray-400 mb-2 truncate"><i class="fa-solid fa-map-pin mr-1"></i>${r.address}</p>` : ''}
                                <p class="text-xs text-gray-600 line-clamp-2 mb-4 flex-grow">${r.desc || ''}</p>
                                ${isVisited && vInfo.myMemo ? `<div class="bg-emerald-50 p-2 rounded-xl text-xs text-emerald-800 mb-3"><i class="fa-solid fa-comment mr-1"></i>${vInfo.myMemo}</div>` : ''}
                                <div class="flex justify-between items-center pt-3 border-t border-gray-100 text-xs text-gray-500 mt-auto">
                                    <span>${r.budget || ''}</span>
                                    <span class="text-red-500 font-semibold">詳細を見る &rarr;</span>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            }

            printGrid.innerHTML = filtered.map(r => {
                const isVisited = visitedData[r.id]?.visited;
                const vInfo = visitedData[r.id] || {};
                const memoHtml = vInfo.myMemo ? `<div style="background-color: #f0fdf4; padding: 6px; border-radius: 6px; font-size: 10px; color: #166534; margin-top: 6px;">💬 ${vInfo.myMemo}</div>` : '';
                const visitedBadge = isVisited ? `<span style="background-color: #059669; color: white; font-size: 9px; padding: 2px 6px; border-radius: 4px; font-weight: bold; margin-left: 4px;">✓ 行った店</span>` : '';

                return `
                    <div class="print-card" style="background: white; border: 1px solid #e5e7eb; border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; margin-bottom: 8px;">
                        <div style="height: 110px; background-color: #f3f4f6; overflow: hidden; position: relative;">
                            <img src="${r.image}" style="width: 100%; height: 100%; object-fit: cover;">
                            <span style="position: absolute; bottom: 6px; left: 6px; background: rgba(0,0,0,0.6); color: white; font-size: 9px; padding: 1px 6px; border-radius: 4px;">${r.genre}</span>
                        </div>
                        <div style="padding: 10px; display: flex; flex-direction: column; flex-grow: 1;">
                            <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 2px;">
                                <div style="font-size: 13px; font-weight: bold; color: #111827;">${r.name} ${visitedBadge}</div>
                                <div style="font-size: 11px; font-weight: bold; color: #d97706;">★${r.rating}</div>
                            </div>
                            <div style="font-size: 10px; color: #6b7280; margin-bottom: 2px;">📍 ${r.area} ${r.address ? '/ ' + r.address : ''}</div>
                            <div style="font-size: 10px; color: #4b5563; line-height: 1.3; margin-bottom: 4px;">${r.desc || ''}</div>
                            ${memoHtml}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function filterRestaurants() { renderRestaurants(); }
        function triggerPrint() { document.getElementById('printDate').innerText = new Date().toLocaleDateString('ja-JP'); window.print(); }

        function openConfigModal() {
            document.getElementById('sheetUrlInput').value = sheetUrl;
            document.getElementById('configModal').classList.remove('hidden');
        }
        function closeConfigModal() { document.getElementById('configModal').classList.add('hidden'); }

        function saveConfigAndReload() {
            const url = document.getElementById('sheetUrlInput').value.trim();
            if (!url) { alert('URLを入力してください。'); return; }
            sheetUrl = url;
            localStorage.setItem('fukuoka_sheet_url', sheetUrl);
            closeConfigModal();
            fetchSheetData();
        }

        function openDetailModal(id) {
            currentModalId = id;
            const r = restaurants.find(item => item.id === id);
            if (!r) return;

            document.getElementById('modalImg').src = r.image;
            document.getElementById('modalGenre').innerText = r.genre;
            document.getElementById('modalName').innerText = r.name;
            document.getElementById('modalArea').innerHTML = `<i class="fa-solid fa-location-dot mr-1 text-red-500"></i>${r.area}`;
            document.getElementById('modalRating').innerText = r.rating;
            document.getElementById('modalBudget').innerText = r.budget || '';
            document.getElementById('modalDesc').innerText = r.desc || '';
            document.getElementById('modalAddress').innerText = r.address || '情報なし';

            const urlContainer = document.getElementById('modalUrlContainer');
            const urlElem = document.getElementById('modalUrl');
            if (r.url) { urlElem.href = r.url; urlElem.innerText = r.url; urlContainer.classList.remove('hidden'); } else { urlContainer.classList.add('hidden'); }

            const vInfo = visitedData[r.id] || { visited: false, visitDate: '', myRating: '5', myMemo: '' };
            document.getElementById('modalVisitedToggle').checked = !!vInfo.visited;
            document.getElementById('modalVisitDate').value = vInfo.visitDate || '';
            document.getElementById('modalMyRating').value = vInfo.myRating || '5';
            document.getElementById('modalMyMemo').value = vInfo.myMemo || '';

            document.getElementById('modalVisitedBadge').classList.toggle('hidden', !vInfo.visited);
            document.getElementById('detailModal').classList.remove('hidden');
        }

        function closeDetailModal() { document.getElementById('detailModal').classList.add('hidden'); currentModalId = null; renderRestaurants(); }

        function toggleVisitedStatus() {
            const isChecked = document.getElementById('modalVisitedToggle').checked;
            if (!visitedData[currentModalId]) visitedData[currentModalId] = {};
            visitedData[currentModalId].visited = isChecked;
            document.getElementById('modalVisitedBadge').classList.toggle('hidden', !isChecked);
            saveVisitDataLocally();
        }

        function saveVisitData() {
            if (!visitedData[currentModalId]) visitedData[currentModalId] = {};
            visitedData[currentModalId].visitDate = document.getElementById('modalVisitDate').value;
            visitedData[currentModalId].myRating = document.getElementById('modalMyRating').value;
            visitedData[currentModalId].myMemo = document.getElementById('modalMyMemo').value;
            saveVisitDataLocally();
        }

        window.onload = initApp;
    </script>
</body>
</html>
